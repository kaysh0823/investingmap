name: Sync quotes to Supabase

on:
  # Backup only — GitHub schedule cron is heavily throttled (often 1–3h gaps).
  # Prefer external cron → repository_dispatch (intraday ~10m + close slots).
  # Slots: regular 09:00–15:30 / regular_close 15:40 / post_close 20:05
  #         + post_close_retry 20:30 / 21:00 / 21:30 (HISTORY_PENDING / tip guard).
  # No aftermarket 16:00–19:50 runs (NXT prices must never feed returns).
  schedule:
    # KST 09:00–14:50 (UTC 00:00–05:50), every 10 min, Mon–Fri
    - cron: '*/10 0-5 * * 1-5'
    # KST 15:00–15:30 (UTC 06:00–06:30), every 10 min
    - cron: '0,10,20,30 6 * * 1-5'
    # KST 15:40 (UTC 06:40) backup — regular_close
    - cron: '40 6 * * 1-5'
    # KST 20:00 (UTC 11:00) backup — post_close
    - cron: '0 11 * * 1-5'
    # KST 20:30 / 21:00 / 21:30 — post_close_retry (HISTORY_PENDING / tip guard)
    - cron: '30 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
  repository_dispatch:
    types: [sync-quotes]
  workflow_dispatch:
    inputs:
      slot:
        description: "regular_close | post_close | post_close_retry | intraday (empty = auto/KST)"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sync-quotes
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve sync slot
        id: slot
        env:
          DISPATCH_SLOT: ${{ github.event.client_payload.slot || github.event.inputs.slot || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SLOT="${DISPATCH_SLOT:-}"
          KST_HM="$(TZ=Asia/Seoul date +%H%M)"
          KST_NOW="$(TZ=Asia/Seoul date -Iseconds)"

          if [ -z "$SLOT" ]; then
            if [ "$KST_HM" -ge 1535 ] && [ "$KST_HM" -le 1550 ]; then
              SLOT=regular_close
            elif [ "$KST_HM" -ge 1955 ] && [ "$KST_HM" -le 2015 ]; then
              SLOT=post_close
            elif [ "$KST_HM" -ge 2025 ] && [ "$KST_HM" -le 2140 ]; then
              SLOT=post_close_retry
            else
              SLOT=intraday
            fi
          fi

          case "$SLOT" in
            regular_close|post_close|post_close_retry|intraday) ;;
            *)
              echo "Unknown slot='$SLOT' — falling back to intraday"
              SLOT=intraday
              ;;
          esac

          # post_close_retry uses the same chain as post_close
          CHAIN_SLOT="$SLOT"
          if [ "$SLOT" = "post_close_retry" ]; then
            CHAIN_SLOT=post_close
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "chain_slot=$CHAIN_SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot=$SLOT chain=$CHAIN_SLOT event=$EVENT_NAME KST=$KST_NOW (HM=$KST_HM)"

      - name: Sync hub quotes to Supabase
        id: sync_quotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SYNC_SLOT: ${{ steps.slot.outputs.chain_slot }}
        run: |
          set +e
          echo "Sync quotes (slot=$SYNC_SLOT) — apihub/MDCSTAT only for regular close"
          node scripts/sync_quotes_to_supabase.mjs
          code=$?
          set -e
          echo "sync_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "history_pending=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HISTORY_PENDING (exit 3) — skip refs chain; rely on post_close_retry"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "history_pending=false" >> "$GITHUB_OUTPUT"

      - name: Sync KRX valuation (PER/PBR)
        id: sync_valuation
        if: >
          (steps.slot.outputs.chain_slot == 'post_close') &&
          (steps.sync_quotes.outputs.history_pending != 'true')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          set +e
          node scripts/sync_valuation_daily.mjs
          code=$?
          set -e
          echo "valuation_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "valuation_pending=true" >> "$GITHUB_OUTPUT"
            echo "::warning::VALUATION_PENDING (exit 3) — continue chain; retry later"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "valuation_pending=false" >> "$GITHUB_OUTPUT"

      - name: Note regular_close OHLC
        if: steps.slot.outputs.slot == 'regular_close'
        run: |
          echo "regular_close: quotes sync + session-close OHLC path (MDCSTAT01501 / apihub) completed."

      - name: Refresh RS snapshot + return refs
        id: refs
        if: >
          (steps.slot.outputs.chain_slot == 'post_close') &&
          (steps.sync_quotes.outputs.history_pending != 'true')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          REFRESH_HUB_SNAPSHOTS: '1'
        run: |
          set -euo pipefail
          REQUIRE_DATE="$(TZ=Asia/Seoul date +%Y%m%d)"
          set +e
          node scripts/build_hub_rs_snapshot.mjs
          rs_code=$?
          set -e
          if [ "$rs_code" -ne 0 ]; then
            exit "$rs_code"
          fi
          set +e
          node scripts/build_hub_return_refs.mjs --guard-today --require-date="$REQUIRE_DATE"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::post_close: tip/source guard — skip refs commit (retry later)"
            git checkout -- data/hub_rs_snapshot.json 2>/dev/null || true
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          node scripts/build_hub_sector_returns.mjs
          node scripts/build_hub_volatility_snapshot.mjs
          set +e
          node scripts/build_hub_valuation_snapshot.mjs
          val_code=$?
          set -e
          if [ "$val_code" -ne 0 ]; then
            echo "::warning::hub_valuation_snapshot build failed (exit $val_code) — continuing"
          fi

      - name: Commit refs and RS snapshot
        if: >
          steps.slot.outputs.chain_slot == 'post_close' &&
          steps.sync_quotes.outputs.history_pending != 'true' &&
          steps.refs.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hub_return_refs.json data/hub_rs_snapshot.json data/hub_sector_returns.json data/hub_volatility_snapshot.json data/hub_valuation_snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: post_close refresh hub_return_refs + hub_rs_snapshot + hub_sector_returns + hub_volatility_snapshot + hub_valuation_snapshot"
          git push

      - name: Verify views consistency
        if: >
          steps.slot.outputs.slot == 'regular_close' ||
          (steps.slot.outputs.chain_slot == 'post_close' &&
           steps.sync_quotes.outputs.history_pending != 'true' &&
           steps.refs.outputs.skipped != 'true')
        env:
          BASE_URL: https://www.investingmap.kr
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run verify:views

      - name: Verify views consistency (last intraday)
        if: steps.slot.outputs.slot == 'intraday'
        env:
          BASE_URL: https://www.investingmap.kr
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KST_HM="$(TZ=Asia/Seoul date +%H%M)"
          if [ "$KST_HM" -ge 1520 ] && [ "$KST_HM" -le 1540 ]; then
            npm run verify:views
          else
            echo "skip verify:views for mid-session intraday (KST=$KST_HM)"
          fi

      # Surface HISTORY_PENDING / tip-guard skip as a soft failure marker for dashboards.
      - name: Fail job when post_close still pending
        if: >
          steps.slot.outputs.chain_slot == 'post_close' &&
          (steps.sync_quotes.outputs.history_pending == 'true' ||
           steps.refs.outputs.skipped == 'true')
        run: |
          echo "::error::post_close incomplete — HISTORY_PENDING or tip/source guard (exit 3 semantics)"
          exit 3
