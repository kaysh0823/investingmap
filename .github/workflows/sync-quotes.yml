name: Sync quotes to Supabase

on:
  # Backup only — GitHub schedule cron is heavily throttled (often 1–3h gaps).
  # Prefer external cron → repository_dispatch (intraday + close slots).
  # Backup cron stays every 10 min. A 5 min GitHub schedule still pays runner
  # startup; overlapping intraday runs are dropped by the freshness guard.
  # Slots: regular 09:00–15:30 / regular_close 15:40 / post_close 20:05
  #         + post_close_retry 20:30 / 21:00 / 21:30 (HISTORY_PENDING / tip guard).
  # No aftermarket 16:00–19:50 runs (NXT prices must never feed returns).
  schedule:
    # KST 09:00–14:50 (UTC 00:00–05:50), every 10 min, Mon–Fri
    - cron: '*/10 0-5 * * 1-5'
    # KST 15:00–15:30 (UTC 06:00–06:30), every 10 min
    - cron: '0,10,20,30 6 * * 1-5'
    # KST 15:40 (UTC 06:40) backup — regular_close
    - cron: '40 6 * * 1-5'
    # KST 20:00 (UTC 11:00) backup — post_close
    - cron: '0 11 * * 1-5'
    # KST 20:30 / 21:00 / 21:30 — post_close_retry (HISTORY_PENDING / tip guard)
    - cron: '30 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
  repository_dispatch:
    types: [sync-quotes]
  workflow_dispatch:
    inputs:
      slot:
        description: "regular_close | post_close | post_close_retry | intraday (empty = auto/KST)"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sync-quotes
      cancel-in-progress: false

    steps:
      # Before checkout so a fresh intraday run skips clone, npm ci, and sync.
      # Query failure must not skip — continue the job. Never log secret values.
      - name: Freshness guard
        id: fresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISPATCH_SLOT: ${{ github.event.client_payload.slot || github.event.inputs.slot || '' }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::add-mask::${SUPABASE_SERVICE_ROLE_KEY}"
          fi

          SLOT="${DISPATCH_SLOT:-}"
          KST_HM="$(TZ=Asia/Seoul date +%H%M)"
          if [ -z "$SLOT" ]; then
            if [ "$KST_HM" -ge 1535 ] && [ "$KST_HM" -le 1550 ]; then
              SLOT=regular_close
            elif [ "$KST_HM" -ge 1955 ] && [ "$KST_HM" -le 2015 ]; then
              SLOT=post_close
            elif [ "$KST_HM" -ge 2025 ] && [ "$KST_HM" -le 2140 ]; then
              SLOT=post_close_retry
            else
              SLOT=intraday
            fi
          fi
          case "$SLOT" in
            regular_close|post_close|post_close_retry|intraday) ;;
            *)
              echo "Unknown slot='$SLOT' — falling back to intraday"
              SLOT=intraday
              ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          if [ "$SLOT" != "intraday" ]; then
            echo "freshness guard: slot=$SLOT — not intraday, continue"
            exit 0
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "freshness guard: query failed — continue"
            exit 0
          fi

          body_file="$(mktemp)"
          set +e
          http="$(curl -sS -o "$body_file" -w "%{http_code}" --max-time 20 \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/stock_quotes_latest?select=as_of&order=as_of.desc&limit=1")"
          curl_code=$?
          set -e
          if [ "$curl_code" -ne 0 ] || [ "$http" != "200" ]; then
            echo "freshness guard: query failed — continue"
            rm -f "$body_file"
            exit 0
          fi

          set +e
          out="$(python3 - "$body_file" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          path = sys.argv[1]
          try:
              rows = json.loads(open(path, encoding="utf-8").read())
          except Exception:
              print("continue")
              raise SystemExit(0)
          if not isinstance(rows, list) or not rows or not isinstance(rows[0], dict):
              print("continue")
              raise SystemExit(0)
          as_of = rows[0].get("as_of")
          if not as_of:
              print("continue")
              raise SystemExit(0)
          text = str(as_of).replace("Z", "+00:00")
          try:
              dt = datetime.fromisoformat(text)
          except Exception:
              print("continue")
              raise SystemExit(0)
          if dt.tzinfo is None:
              dt = dt.replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - dt).total_seconds()
          # as_of는 네이버 조회 완료 시각(실행 시작 후 약 2분).
          # 90초 기준이면 5분 주기의 정상 실행은 통과하고, 같은 시각에 겹친 트리거
          # (cron-job.org + GitHub 백업이 동시에 와서 앞 실행이 끝난 직후 시작하는 두 번째 실행)만 건너뜀.
          if -300 <= age <= 90:
              print("skip")
          else:
              print("continue")
          print(f"{age:.0f}")
          PY
          )"
          py_code=$?
          set -e
          rm -f "$body_file"
          if [ "$py_code" -ne 0 ]; then
            echo "freshness guard: query failed — continue"
            exit 0
          fi
          decision="$(printf '%s\n' "$out" | sed -n '1p')"
          age="$(printf '%s\n' "$out" | sed -n '2p')"
          if [ "$decision" = "skip" ]; then
            echo "fresh — skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "freshness guard: as_of age ${age:-n/a}s — continue"

      - name: Checkout
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve sync slot
        id: slot
        if: steps.fresh.outputs.skip != 'true'
        env:
          DISPATCH_SLOT: ${{ github.event.client_payload.slot || github.event.inputs.slot || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SLOT="${DISPATCH_SLOT:-}"
          KST_HM="$(TZ=Asia/Seoul date +%H%M)"
          KST_NOW="$(TZ=Asia/Seoul date -Iseconds)"

          if [ -z "$SLOT" ]; then
            if [ "$KST_HM" -ge 1535 ] && [ "$KST_HM" -le 1550 ]; then
              SLOT=regular_close
            elif [ "$KST_HM" -ge 1955 ] && [ "$KST_HM" -le 2015 ]; then
              SLOT=post_close
            elif [ "$KST_HM" -ge 2025 ] && [ "$KST_HM" -le 2140 ]; then
              SLOT=post_close_retry
            else
              SLOT=intraday
            fi
          fi

          case "$SLOT" in
            regular_close|post_close|post_close_retry|intraday) ;;
            *)
              echo "Unknown slot='$SLOT' — falling back to intraday"
              SLOT=intraday
              ;;
          esac

          # post_close_retry uses the same chain as post_close
          CHAIN_SLOT="$SLOT"
          if [ "$SLOT" = "post_close_retry" ]; then
            CHAIN_SLOT=post_close
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "chain_slot=$CHAIN_SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot=$SLOT chain=$CHAIN_SLOT event=$EVENT_NAME KST=$KST_NOW (HM=$KST_HM)"

      - name: Sync hub quotes to Supabase
        id: sync_quotes
        if: steps.fresh.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SYNC_SLOT: ${{ steps.slot.outputs.chain_slot }}
        run: |
          log="${RUNNER_TEMP}/sync_quotes.log"
          start_iso="$(date -Iseconds)"
          start_s="$(date +%s)"
          set +e
          set -o pipefail
          echo "Sync quotes (slot=$SYNC_SLOT) — apihub/MDCSTAT only for regular close"
          node scripts/sync_quotes_to_supabase.mjs | tee "$log"
          code=$?
          set +o pipefail
          set -e
          end_iso="$(date -Iseconds)"
          end_s="$(date +%s)"
          elapsed="$((end_s - start_s))"
          tickers="$(grep -E '^total tickers:' "$log" | tail -1 | awk '{print $NF}' || true)"
          naver_ok="$(grep -E '^naver ok:' "$log" | tail -1 | awk '{print $NF}' || true)"
          naver_fail="$(grep -E '^naver failed:' "$log" | tail -1 | awk '{print $NF}' || true)"
          {
            echo "### sync-quotes"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| slot | ${SYNC_SLOT} |"
            echo "| start | ${start_iso} |"
            echo "| end | ${end_iso} |"
            echo "| elapsed_sec | ${elapsed} |"
            echo "| tickers | ${tickers:-n/a} |"
            echo "| naver_ok | ${naver_ok:-n/a} |"
            echo "| naver_fail | ${naver_fail:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sync_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "history_pending=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HISTORY_PENDING (exit 3) — skip refs chain; rely on post_close_retry"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "history_pending=false" >> "$GITHUB_OUTPUT"

      - name: Sync KRX valuation (PER/PBR)
        id: sync_valuation
        if: >
          steps.fresh.outputs.skip != 'true' &&
          (steps.slot.outputs.chain_slot == 'post_close') &&
          (steps.sync_quotes.outputs.history_pending != 'true')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          set +e
          node scripts/sync_valuation_daily.mjs
          code=$?
          set -e
          echo "valuation_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "valuation_pending=true" >> "$GITHUB_OUTPUT"
            echo "::warning::VALUATION_PENDING (exit 3) — continue chain; retry later"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "valuation_pending=false" >> "$GITHUB_OUTPUT"

      - name: Note regular_close OHLC
        if: steps.fresh.outputs.skip != 'true' && steps.slot.outputs.slot == 'regular_close'
        run: |
          echo "regular_close: quotes sync + session-close OHLC path (MDCSTAT01501 / apihub) completed."

      - name: Refresh RS snapshot + return refs
        id: refs
        if: >
          steps.fresh.outputs.skip != 'true' &&
          (steps.slot.outputs.chain_slot == 'post_close') &&
          (steps.sync_quotes.outputs.history_pending != 'true')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          REFRESH_HUB_SNAPSHOTS: '1'
        run: |
          set -euo pipefail
          REQUIRE_DATE="$(TZ=Asia/Seoul date +%Y%m%d)"
          set +e
          node scripts/build_hub_rs_snapshot.mjs
          rs_code=$?
          set -e
          if [ "$rs_code" -ne 0 ]; then
            exit "$rs_code"
          fi
          set +e
          node scripts/build_hub_return_refs.mjs --guard-today --require-date="$REQUIRE_DATE"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::post_close: tip/source guard — skip refs commit (retry later)"
            git checkout -- data/hub_rs_snapshot.json 2>/dev/null || true
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          node scripts/build_hub_sector_returns.mjs
          node scripts/build_hub_volatility_snapshot.mjs
          node scripts/build_hub_bb_score.mjs
          set +e
          node scripts/build_hub_valuation_snapshot.mjs
          val_code=$?
          set -e
          if [ "$val_code" -ne 0 ]; then
            echo "::warning::hub_valuation_snapshot build failed (exit $val_code) — continuing"
          fi

      - name: Commit refs and RS snapshot
        if: >
          steps.fresh.outputs.skip != 'true' &&
          steps.slot.outputs.chain_slot == 'post_close' &&
          steps.sync_quotes.outputs.history_pending != 'true' &&
          steps.refs.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hub_return_refs.json data/hub_rs_snapshot.json data/hub_sector_returns.json data/hub_volatility_snapshot.json data/hub_valuation_snapshot.json data/hub_bb_score.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: post_close refresh hub_return_refs + hub_rs_snapshot + hub_sector_returns + hub_volatility_snapshot + hub_valuation_snapshot + hub_bb_score"
          git push

      - name: Verify views consistency
        if: >
          steps.fresh.outputs.skip != 'true' &&
          (steps.slot.outputs.slot == 'regular_close' ||
          (steps.slot.outputs.chain_slot == 'post_close' &&
           steps.sync_quotes.outputs.history_pending != 'true' &&
           steps.refs.outputs.skipped != 'true'))
        env:
          BASE_URL: https://www.investingmap.kr
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run verify:views

      - name: Verify views consistency (last intraday)
        if: steps.fresh.outputs.skip != 'true' && steps.slot.outputs.slot == 'intraday'
        env:
          BASE_URL: https://www.investingmap.kr
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KST_HM="$(TZ=Asia/Seoul date +%H%M)"
          if [ "$KST_HM" -ge 1520 ] && [ "$KST_HM" -le 1540 ]; then
            npm run verify:views
          else
            echo "skip verify:views for mid-session intraday (KST=$KST_HM)"
          fi

      # Surface HISTORY_PENDING / tip-guard skip as a soft failure marker for dashboards.
      - name: Fail job when post_close still pending
        if: >
          steps.fresh.outputs.skip != 'true' &&
          steps.slot.outputs.chain_slot == 'post_close' &&
          (steps.sync_quotes.outputs.history_pending == 'true' ||
           steps.refs.outputs.skipped == 'true')
        run: |
          echo "::error::post_close incomplete — HISTORY_PENDING or tip/source guard (exit 3 semantics)"
          exit 3
