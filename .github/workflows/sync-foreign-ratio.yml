name: Sync foreign ratio to Supabase

on:
  schedule:
    # Backup only — GitHub schedule runs hours late. Primary trigger: sync-quotes
    # post_close (20:05 KST) / post_close_retry (20:30–21:30) dispatches this workflow.
    # Mon–Fri 20:10 KST = 11:10 UTC
    - cron: '10 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sync-foreign-ratio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Sync KRX foreign ownership ratio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run sync:foreign-ratio

      # Refill recent days a failed run left empty (e.g. KRX login failure). Skips existing dates.
      - name: Backfill missing recent days
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run backfill:foreign-ratio -- --days=10
