name: Sync foreign ratio to Supabase

on:
  schedule:
    # One scheduled attempt per weekday at 21:15 KST.
    # This reduces existing traffic; it does not establish collection permission.
    # No closing-price dispatch retries or automatic historical backfill.
    - cron: '15 12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: krx-delayed-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Sync KRX foreign ownership ratio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run sync:foreign-ratio
