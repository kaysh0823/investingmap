name: Sync foreign ratio to Supabase

# Paused at the owner's request. Do not resume collection without approval.
on:
  workflow_dispatch:

concurrency:
  group: sync-foreign-ratio
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Sync KRX foreign ownership ratio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run sync:foreign-ratio

      # Refill recent days a failed run left empty (e.g. KRX login failure). Skips existing dates.
      - name: Backfill missing recent days
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run backfill:foreign-ratio -- --days=10
