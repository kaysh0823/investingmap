name: Verify KRX transport diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-krx-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Offline transport and diagnostic regressions
        run: npm run verify:krx-transport
