name: Sync investor net to Supabase

on:
  schedule:
    # One scheduled attempt per weekday at 21:00 KST.
    # This reduces existing traffic; it does not establish collection permission.
    # No closing-price dispatch retries or automatic historical backfill.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: krx-delayed-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Sync KRX investor net purchase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run sync:investor-net

      # 신용잔고율 (KIS daily-credit-balance, T+2). Re-fetches the last 30 sessions
      # per ticker, so a missed day self-heals on the next run.
      - name: Sync credit balance (KIS)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          if [ -z "$KIS_APP_KEY" ] || [ -z "$KIS_APP_SECRET" ]; then
            echo "::warning::KIS_APP_KEY / KIS_APP_SECRET secrets missing — skip credit balance"
            exit 0
          fi
          npm run sync:credit-balance
