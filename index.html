<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 반도체 산업 투자 지도 / Korea Semiconductor Investment Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
    --text:#e6edf3;--text-muted:#8b949e;--accent:#58a6ff;
    --c-idm:#4FC3F7;--c-fabless:#66BB6A;--c-foundry:#FFA726;
    --c-material:#EF5350;--c-equipment:#AB47BC;--c-parts:#26C6DA;--c-packaging:#FFCA28;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,sans-serif;font-size:14px;min-height:100vh}

  /* HEADER */
  .header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 28px 16px;position:relative}
  .header h1{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
  .header p{color:var(--text-muted);font-size:13px;margin-top:4px}
  .header-meta{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
  .badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:11px;color:var(--text-muted)}
  .badge span{color:var(--accent);font-weight:600}
  .lang-toggle{position:absolute;top:20px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 16px;color:var(--text-muted);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;letter-spacing:.3px}
  .lang-toggle:hover{border-color:var(--accent);color:var(--text)}
  .lang-toggle .flag{margin-right:5px}

  /* TABS */
  .tabs{display:flex;border-bottom:1px solid var(--border);padding:0 28px;background:var(--surface)}
  .tab-btn{padding:12px 20px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-btn:hover:not(.active){color:var(--text)}

  /* TAB CONTENT */
  .tab-content{display:none}.tab-content.active{display:block}

  /* TABLE TAB */
  .table-container{padding:20px 28px}
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
  .filter-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #chain-chips,#market-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .filter-label{color:var(--text-muted);font-size:12px;font-weight:600;margin-right:2px}
  .filter-chip{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--text-muted);transition:all .15s;white-space:nowrap}
  .filter-chip:hover{border-color:var(--accent);color:var(--text)}
  .filter-chip.active{border-color:transparent;color:#0d1117;font-weight:600}
  .filter-divider{width:1px;height:24px;background:var(--border)}
  .search-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;outline:none;width:200px}
  .search-box:focus{border-color:var(--accent)}
  .result-count{margin-left:auto;color:var(--text-muted);font-size:12px}
  .tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse}
  thead th{background:var(--surface2);padding:11px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;cursor:pointer;user-select:none}
  thead th:hover{color:var(--text)}
  thead th.sort-asc::after{content:' ↑';color:var(--accent)}
  thead th.sort-desc::after{content:' ↓';color:var(--accent)}
  tbody tr{border-top:1px solid var(--border);transition:background .1s}
  tbody tr:hover{background:var(--surface2)}
  td{padding:11px 14px;vertical-align:middle}
  .company-name{font-weight:600;color:var(--text)}
  .company-name-sub{color:var(--text-muted);font-size:11px;margin-top:2px}
  .ticker{font-family:monospace;font-size:12px;color:var(--accent);background:rgba(88,166,255,.1);padding:2px 7px;border-radius:4px;white-space:nowrap}
  .market-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
  .market-badge.kospi{background:rgba(79,195,247,.15);color:#4FC3F7}
  .market-badge.kosdaq{background:rgba(102,187,106,.15);color:#66BB6A}
  .chain-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap}
  .partners-list{display:flex;flex-wrap:wrap;gap:4px}
  .partner-tag{font-size:11px;padding:2px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);white-space:nowrap}
  .partner-tag.us{border-color:rgba(144,164,174,.4);color:#90A4AE}
  .partner-tag.tw{border-color:rgba(128,203,196,.4);color:#80CBC4}
  .partner-tag.eu{border-color:rgba(176,190,197,.4);color:#B0BEC5}
  .partner-tag.cn{border-color:rgba(244,143,177,.4);color:#F48FB1}
  .partner-tag.kr{border-color:rgba(165,214,167,.4);color:#A5D6A7}
  .products-cell{color:var(--text-muted);font-size:12px;max-width:200px}
  .note{font-size:11px;color:var(--text-muted);margin-top:8px;padding:8px 12px;background:var(--surface2);border-radius:6px;border-left:3px solid var(--border)}

  /* GRAPH TAB */
  .graph-container{display:flex;height:calc(100vh - 110px)}
  .graph-sidebar{width:240px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto}
  .graph-main{flex:1;position:relative}
  #graph-svg{width:100%;height:100%}
  .sidebar-section{margin-bottom:20px}
  .sidebar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:10px}
  .legend-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--text-muted);cursor:pointer;padding:3px 5px;border-radius:5px;transition:background .15s}
  .legend-item:hover{background:var(--surface2);color:var(--text)}
  .legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .legend-diamond{width:12px;height:12px;flex-shrink:0;transform:rotate(45deg);border-radius:2px}
  .graph-tooltip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;pointer-events:none;z-index:100;min-width:200px;max-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .tooltip-name{font-weight:700;font-size:14px;margin-bottom:3px}
  .tooltip-meta{font-size:11px;color:var(--text-muted);margin-bottom:6px}
  .tooltip-row{display:flex;gap:6px;align-items:flex-start;margin-top:4px;font-size:12px}
  .tooltip-label{color:var(--text-muted);min-width:64px;flex-shrink:0}
  .tooltip-val{color:var(--text)}
  .graph-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted);background:rgba(13,17,23,.8);padding:5px 14px;border-radius:20px;border:1px solid var(--border);pointer-events:none;white-space:nowrap}
  .graph-controls{position:absolute;bottom:14px;right:14px;display:flex;gap:6px}
  .graph-ctrl-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .graph-ctrl-btn:hover{color:var(--text);border-color:var(--accent)}
  .node-dim{opacity:.15}
  @media(max-width:768px){.graph-sidebar{display:none}.table-container{padding:12px}.header{padding:14px 16px}.lang-toggle{top:12px;right:10px;padding:4px 10px;font-size:11px}}
</style>
</head>

</div>

<div class="tabs">

</div>

<!-- TABLE TAB -->
<div id="tab-table" class="tab-content active">
  <div class="table-container">
    <div class="filter-bar">

        <div id="chain-chips"></div>
      </div>

      <div class="result-count" id="result-label">표시: <span id="show-count">64</span>개</div>
    </div>
    <div class="tbl-wrap">
      <table id="main-table">
        <thead>
          <tr>
            <th id="th-name" onclick="sortTable('name')">기업명</th>
            <th id="th-ticker" onclick="sortTable('ticker')">종목코드</th>
            <th id="th-market" onclick="sortTable('market')">시장</th>
            <th id="th-chain" onclick="sortTable('chain')">벨류체인</th>
            <th id="th-semtype">반도체 유형</th>
            <th id="th-products">주요 제품</th>
            <th id="th-partners">글로벌 주요 거래처</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <p class="note" id="table-note">⚠ 종목코드 및 거래 관계는 공개 정보 기반이며, 투자 판단 전 KRX·사업보고서에서 최신 정보를 확인하세요.</p>
  </div>
</div>

<!-- GRAPH TAB -->
<div id="tab-graph" class="tab-content">
  <div class="graph-container">
    <div class="graph-sidebar">
      <div class="sidebar-section">

        <div id="sb-chain-legend"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title" id="sb-global">글로벌 파트너</div>
        <div id="sb-region-legend"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title" id="sb-size">노드 크기 기준</div>
        <div id="sb-size-desc" style="font-size:11px;color:var(--text-muted);line-height:1.8"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title" id="sb-how">조작 방법</div>
        <div id="sb-how-desc" style="font-size:11px;color:var(--text-muted);line-height:1.8"></div>
      </div>
    </div>
    <div class="graph-main">
      <svg id="graph-svg"></svg>
      <div id="graph-tooltip" class="graph-tooltip" style="display:none"></div>
      <div class="graph-hint" id="graph-hint-text">노드를 클릭하면 거래 관계가 강조됩니다</div>
      <div class="graph-controls">
        <button class="graph-ctrl-btn" onclick="resetZoom()" title="Reset">⟳</button>
        <button class="graph-ctrl-btn" onclick="zoomIn()">+</button>
        <button class="graph-ctrl-btn" onclick="zoomOut()">−</button>
      </div>
    </div>
  </div>
</div>

function toggleLang() {
  lang = lang === 'ko' ? 'en' : 'ko';
  applyLang();
}

function applyLang() {
  const t = T[lang];
  document.getElementById('hdr-title').textContent = t.title;
  document.getElementById('hdr-subtitle').textContent = t.subtitle;
  document.getElementById('badge-total').innerHTML = t.badgeTotal;
  document.getElementById('badge-market').innerHTML = t.badgeMarket;
  document.getElementById('badge-src').textContent = t.badgeSrc;
  document.getElementById('tab-btn-table').innerHTML = t.tabTable;
  document.getElementById('tab-btn-graph').innerHTML = t.tabGraph;
  document.querySelector('.lang-toggle .flag').textContent = t.langFlag;
  document.getElementById('lang-toggle-text').textContent = t.langText;
  document.getElementById('fl-chain-label').textContent = t.flChain;
  document.getElementById('fl-market-label').textContent = t.flMarket;
  document.getElementById('search-input').placeholder = t.searchPlaceholder;
  document.getElementById('result-label').innerHTML = t.resultLabel + '<span id="show-count"></span>' + t.resultUnit;
  document.getElementById('th-name').textContent = t.thName;
  document.getElementById('th-ticker').textContent = t.thTicker;
  document.getElementById('th-market').textContent = t.thMarket;
  document.getElementById('th-chain').textContent = t.thChain;
  document.getElementById('th-semtype').textContent = t.thSemType;
  document.getElementById('th-products').textContent = t.thProducts;
  document.getElementById('th-partners').textContent = t.thPartners;
  document.getElementById('table-note').textContent = t.note;
  document.getElementById('sb-korean').textContent = t.sbKorean;
  document.getElementById('sb-global').textContent = t.sbGlobal;
  document.getElementById('sb-size').textContent = t.sbSize;
  document.getElementById('sb-how').textContent = t.sbHow;
  document.getElementById('sb-size-desc').innerHTML = t.sizeDesc.replace(/\n/g,'<br>');
  document.getElementById('sb-how-desc').innerHTML = t.howDesc.replace(/\n/g,'<br>');
  document.getElementById('graph-hint-text').textContent = t.graphHint;
  // Rebuild dynamic UI
  buildChainChips();
  buildMarketChips();
  buildSidebarLegend();
  renderTable();
  // Update graph node labels if graph is already built
  if (svgEl) {
    svgEl.selectAll('.node text')
      .text(d => {
        if (d.type === 'korean') return lang === 'en' ? (d.labelEn || d.label) : d.label;
        return d.label;
      });
  }
}

function buildChainChips() {
  const t = T[lang];
  const container = document.getElementById('chain-chips');
  const chains = ['all','IDM','팹리스','파운드리','소재','장비','부품/기판','패키징/테스트'];
  container.innerHTML = chains.map(ch => {
    const label = ch === 'all' ? t.allFilter : (t.chainFilter[ch] || ch);
    const isActive = currentChain === ch;
    const color = CHAIN_COLORS[ch];
    const style = isActive ? `background:${color||'#4FC3F7'};color:#0d1117;border-color:transparent;` : '';
    return `<div class="filter-chip${isActive?' active':''}" style="${style}" data-filter-chain="${ch}" onclick="setChainFilter('${ch}',this)">${label}</div>`;
  }).join('');
}

function buildMarketChips() {
  const t = T[lang];
  const container = document.getElementById('market-chips');
  const markets = ['all','KOSPI','KOSDAQ'];
  container.innerHTML = markets.map(m => {
    const label = m === 'all' ? t.allFilter : m;
    const isActive = currentMarket === m;
    const style = isActive ? 'background:#58a6ff;color:#0d1117;border-color:transparent;' : '';
    return `<div class="filter-chip${isActive?' active':''}" style="${style}" data-filter-market="${m}" onclick="setMarketFilter('${m}',this)">${label}</div>`;
  }).join('');
}

function buildSidebarLegend() {
  const t = T[lang];
  // Chain legend
  const chainContainer = document.getElementById('sb-chain-legend');
  const chains = ['IDM','팹리스','파운드리','소재','장비','부품/기판','패키징/테스트'];
  chainContainer.innerHTML = chains.map(ch =>
    `<div class="legend-item" onclick="toggleChainHighlight('${ch}')">
      <div class="legend-dot" style="background:${CHAIN_COLORS[ch]}"></div>
      ${t.chainLabel[ch]||ch}
    </div>`
  ).join('');
  // Region legend
  const regionContainer = document.getElementById('sb-region-legend');
  const regions = ['us','tw','cn','eu','kr'];
  regionContainer.innerHTML = regions.map(r =>
    `<div class="legend-item">
      <div class="legend-diamond" style="background:${REGION_COLORS[r]}"></div>
      ${t.regionLabel[r]}
    </div>`
  ).join('');
}

function getChainStyle(chain) {
  const c = CHAIN_COLORS[chain]||'#888';
  return `background:${c}22;color:${c};border:1px solid ${c}55`;
}
function getPartnerInfo(id) {
  const g = globalCompanies.find(x=>x.id===id);
  return g ? {name:g.name, region:g.region} : {name:id, region:'us'};
}

function renderTable() {
  const t = T[lang];
  let data = koreanCompanies.filter(c => {
    if (currentChain !== 'all' && c.chain !== currentChain) return false;
    if (currentMarket !== 'all' && c.market !== currentMarket) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      if (!c.name.includes(searchTerm) && !c.nameEn.toLowerCase().includes(s) && !c.ticker.includes(searchTerm) && !(c.semType||'').includes(searchTerm) && !(c.semTypeEn||'').toLowerCase().includes(s)) return false;
    }
    return true;
  });
  if (sortKey) {
    data.sort((a,b) => { let av=a[sortKey]||'',bv=b[sortKey]||''; return av<bv?-sortDir:av>bv?sortDir:0; });
  }
  const countEl = document.getElementById('show-count');
  if (countEl) countEl.textContent = data.length;

  const chainLabel = (ch) => lang==='ko' ? (t.chainFilter[ch]||ch) : (t.chainFilter[ch]||ch);
  const semTypeField = t.fieldSemType;
  const productsField = t.fieldProducts;

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = data.map(c => {
    const partnerHtml = c.partners.slice(0,6).map(pid => {
      const info = getPartnerInfo(pid);
      return `<span class="partner-tag ${info.region}">${info.name}</span>`;
    }).join('') + (c.partners.length>6 ? `<span class="partner-tag">+${c.partners.length-6}</span>` : '');
    const displayName = lang==='en' ? c.nameEn : c.name;
    const subName = lang==='en' ? c.name : c.nameEn;
    const semTypeDisplay = c[semTypeField] || c.semType;
    const productsDisplay = c[productsField] || c.products;
    const chainDisplay = chainLabel(c.chain);
    return `<tr>
      <td><div class="company-name">${displayName}</div><div class="company-name-sub">${subName}</div></td>
      <td><span class="ticker">${c.ticker}</span></td>
      <td><span class="market-badge ${c.market.toLowerCase()}">${c.market}</span></td>
      <td><span class="chain-tag" style="${getChainStyle(c.chain)}">${chainDisplay}</span></td>
      <td style="font-size:12px;color:var(--text-muted)">${semTypeDisplay}</td>
      <td class="products-cell">${productsDisplay}</td>
      <td><div class="partners-list">${partnerHtml}</div></td>
    </tr>`;
  }).join('');
}

function setChainFilter(chain, el) {
  currentChain = chain;
  buildChainChips();
  renderTable();
}
function setMarketFilter(m, el) {
  currentMarket = m;
  buildMarketChips();
  renderTable();
}
function setSearch(v) { searchTerm = v; renderTable(); }
function sortTable(key) {
  if (sortKey===key) sortDir*=-1; else { sortKey=key; sortDir=1; }
  document.querySelectorAll('thead th').forEach(th=>th.className='');
  const keyMap={name:0,ticker:1,market:2,chain:3};
  const idx=keyMap[key];
  if(idx!==undefined){
    const ths=document.querySelectorAll('thead th');
    if(ths[idx]) ths[idx].className=sortDir===1?'sort-asc':'sort-desc';
  }
  renderTable();
}

  const container = document.getElementById('graph-svg');
  const W = container.clientWidth||900, H = container.clientHeight||700;

  const nodes = [];
  const nodeIndex = {};
  koreanCompanies.forEach(c => {
    nodes.push({id:c.id,label:c.name,labelEn:c.nameEn,type:'korean',chain:c.chain,
                ticker:c.ticker,market:c.market,semType:c.semType,semTypeEn:c.semTypeEn,
                products:c.products,productsEn:c.productsEn,revenue:c.revenue,
                revTier:c.revTier,data:c,r:c.revTier===3?18:c.revTier===2?13:9});
    nodeIndex[c.id]=nodes.length-1;
  });
  const usedGlobal=new Set();
  koreanCompanies.forEach(c=>c.partners.forEach(pid=>usedGlobal.add(pid)));
  globalCompanies.filter(g=>usedGlobal.has(g.id)).forEach(g=>{
    nodes.push({id:g.id,label:g.name,type:'global',region:g.region,sector:g.sector,country:g.country,r:7});
    nodeIndex[g.id]=nodes.length-1;
  });

  const links=[];
  koreanCompanies.forEach(c=>c.partners.forEach(pid=>{
    if(nodeIndex[pid]!==undefined) links.push({source:c.id,target:pid,sourceChain:c.chain});
  }));

  const d3svg=d3.select('#graph-svg');
  d3svg.selectAll('*').remove();
  svgEl=d3svg;
  zoomBehavior=d3.zoom().scaleExtent([0.15,4]).on('zoom',e=>g.attr('transform',e.transform));
  d3svg.call(zoomBehavior);
  d3svg.on('click',(e)=>{if(e.target===d3svg.node()||e.target.tagName==='svg')resetSelection();});
  g=d3svg.append('g');

  simulation=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.source.type==='korean'&&d.target.type==='korean'?60:130).strength(0.3))
    .force('charge',d3.forceManyBody().strength(d=>d.type==='korean'?-200:-90))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collide',d3.forceCollide(d=>d.r+8))
    .force('x',d3.forceX(d=>{
      if(d.type==='korean'){const a={IDM:0,팹리스:60,파운드리:120,소재:180,장비:240,'부품/기판':300,'패키징/테스트':330}[d.chain]||0;return W/2+Math.cos(a*Math.PI/180)*190;}
      return W/2;
    }).strength(0.05))
    .force('y',d3.forceY(d=>{
      if(d.type==='korean'){const a={IDM:0,팹리스:60,파운드리:120,소재:180,장비:240,'부품/기판':300,'패키징/테스트':330}[d.chain]||0;return H/2+Math.sin(a*Math.PI/180)*190;}
      return H/2;
    }).strength(0.05));

  const link=g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke',d=>CHAIN_COLORS[d.sourceChain]||'#555')
    .attr('stroke-opacity',0.22).attr('stroke-width',1.2);

  const node=g.append('g').selectAll('g').data(nodes).join('g')
    .attr('class',d=>`node node-${d.type}`).attr('cursor','pointer')
    .on('mouseover',(e,d)=>showTooltip(e,d))
    .on('mouseout',()=>hideTooltip())
    .on('click',(e,d)=>{e.stopPropagation();selectNode(d,node,link);})
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}));

  node.filter(d=>d.type==='korean').append('circle')
    .attr('r',d=>d.r).attr('fill',d=>CHAIN_COLORS[d.chain]||'#888')
    .attr('fill-opacity',0.85).attr('stroke','#0d1117').attr('stroke-width',1.5);

  node.filter(d=>d.type==='global').append('polygon')
    .attr('points',d=>{const r=d.r+2;return `0,${-r} ${r},0 0,${r} ${-r},0`;})
    .attr('fill',d=>REGION_COLORS[d.region]||'#888').attr('fill-opacity',0.8)
    .attr('stroke','#0d1117').attr('stroke-width',1.2);

  node.filter(d=>d.r>=9||d.type==='global').append('text')
    .text(d=>d.label).attr('text-anchor','middle').attr('dy',d=>d.r+11)
    .attr('font-size',d=>d.type==='korean'?(d.r>=13?11:9):9)
    .attr('fill','#c9d1d9').attr('pointer-events','none');

  simulation.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
  setTimeout(()=>{ svgEl.transition().duration(600).call(zoomBehavior.transform,d3.zoomIdentity.translate(W*0.05,H*0.05).scale(0.88)); },1200);
}

function selectNode(d, node, link) {
  if (selectedNode===d.id){resetSelection();return;}
  selectedNode=d.id;
  const connected=new Set([d.id]);
  link.each(l=>{
    const s=l.source.id||l.source,t=l.target.id||l.target;
    if(s===d.id||t===d.id){connected.add(s);connected.add(t);}
  });
  node.classed('node-dim',n=>!connected.has(n.id));
  link.attr('stroke-opacity',l=>{const s=l.source.id||l.source,t=l.target.id||l.target;return(s===d.id||t===d.id)?0.9:0.03;})
      .attr('stroke-width',l=>{const s=l.source.id||l.source,t=l.target.id||l.target;return(s===d.id||t===d.id)?2.5:0.8;});
}

function resetSelection() {
  selectedNode=null; highlightedChain=null;
  if(!svgEl) return;
  svgEl.selectAll('.node').classed('node-dim',false);
  svgEl.selectAll('line').attr('stroke-opacity',0.22).attr('stroke-width',1.2);
}

function toggleChainHighlight(chain) {
  if(!svgEl) return;
  if(highlightedChain===chain){resetSelection();return;}
  highlightedChain=chain;
  const chainIds=new Set(koreanCompanies.filter(c=>c.chain===chain).map(c=>c.id));
  const linkedIds=new Set(chainIds);
  koreanCompanies.filter(c=>c.chain===chain).forEach(c=>c.partners.forEach(p=>linkedIds.add(p)));
  svgEl.selectAll('.node').classed('node-dim',d=>!linkedIds.has(d.id));
  svgEl.selectAll('line').attr('stroke-opacity',l=>chainIds.has(l.source.id||l.source)?0.75:0.03)
    .attr('stroke-width',l=>chainIds.has(l.source.id||l.source)?2:0.8);
}

function showTooltip(e, d) {
  const tt=document.getElementById('graph-tooltip');
  const t=T[lang];
  const color=d.type==='korean'?(CHAIN_COLORS[d.chain]||'#888'):(REGION_COLORS[d.region]||'#888');
  const displayName = (lang==='en' && d.labelEn) ? d.labelEn : d.label;
  let html=`<div class="tooltip-name" style="color:${color}">${displayName}</div>`;
  if(d.type==='korean'){
    const subName = lang==='en' ? d.label : d.labelEn;
    const chainDisplay = t.chainFilter[d.chain]||d.chain;
    const semTypeDisplay = (lang==='en' ? d.semTypeEn : d.semType)||d.semType;
    const productsDisplay = (lang==='en' ? d.productsEn : d.products)||d.products;
    html+=`<div class="tooltip-meta">${subName} · ${d.ticker} · ${d.market}</div>`;
    html+=`<div class="tooltip-row"><span class="tooltip-label">${t.ttChain}</span><span class="tooltip-val">${chainDisplay}</span></div>`;
    html+=`<div class="tooltip-row"><span class="tooltip-label">${t.ttSemType}</span><span class="tooltip-val">${semTypeDisplay}</span></div>`;
    html+=`<div class="tooltip-row"><span class="tooltip-label">${t.ttProducts}</span><span class="tooltip-val">${productsDisplay}</span></div>`;
    html+=`<div class="tooltip-row"><span class="tooltip-label">${t.ttRevenue}</span><span class="tooltip-val">${d.revenue}</span></div>`;
    const pNames=d.data.partners.slice(0,5).map(pid=>getPartnerInfo(pid).name).join(', ');
    html+=`<div class="tooltip-row"><span class="tooltip-label">${t.ttPartners}</span><span class="tooltip-val">${pNames}${d.data.partners.length>5?'…':''}</span></div>`;
  } else {
    html+=`<div class="tooltip-meta">${d.country} · ${d.sector}</div>`;
    const suppliers=koreanCompanies.filter(c=>c.partners.includes(d.id));
    if(suppliers.length){
      const names=suppliers.slice(0,4).map(s=>lang==='en'?s.nameEn:s.name).join(', ');
      html+=`<div class="tooltip-row"><span class="tooltip-label">${t.ttSuppliers}</span><span class="tooltip-val">${names}${suppliers.length>4?'…':''}</span></div>`;
    }
  }
  tt.innerHTML=html; tt.style.display='block';
  const rect=svgEl.node().getBoundingClientRect();
  tt.style.left=(e.pageX-rect.left-window.scrollX+14)+'px';
  tt.style.top=(e.pageY-rect.top-window.scrollY-10)+'px';
}
function hideTooltip(){document.getElementById('graph-tooltip').style.display='none';}
function resetZoom(){const svgNode=svgEl.node();svgEl.transition().duration(500).call(zoomBehavior.transform,d3.zoomIdentity.translate(svgNode.clientWidth*0.05,svgNode.clientHeight*0.05).scale(0.88));}
function zoomIn(){svgEl.transition().duration(300).call(zoomBehavior.scaleBy,1.3);}
function zoomOut(){svgEl.transition().duration(300).call(zoomBehavior.scaleBy,0.77);}

// ═══════════════════════════════════════════════════════
// TAB SWITCH
// ═══════════════════════════════════════════════════════
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(btn) btn.classList.add('active');
  if(tab==='graph') setTimeout(()=>{ if(!svgEl)buildGraph(); },50);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
applyLang();
</script>
